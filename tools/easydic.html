<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>简约词典 · 路径暂存</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px 40px;
        }

        /* ===== 整体布局：左右结构 ===== */
        .app-layout {
            display: flex;
            gap: 18px;
            max-width: 960px;
            width: 100%;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* ===== 左侧边栏 ===== */
        .sidebar {
            flex: 0 0 210px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05), 0 2px 10px rgba(0, 0, 0, 0.02);
            padding: 18px 14px 20px;
            transition: box-shadow 0.2s;
            min-height: 200px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #0b1b32;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eef3fc;
            flex-shrink: 0;
        }
        .sidebar-title .badge {
            font-size: 12px;
            background: #e4ecf9;
            color: #1e3a6f;
            padding: 0 10px;
            border-radius: 30px;
            font-weight: 500;
            line-height: 22px;
            margin-left: auto;
        }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar-list::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-list::-webkit-scrollbar-thumb {
            background: #d0dbe8;
            border-radius: 10px;
        }

        .saved-item {
            background: #f8faff;
            border-radius: 14px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s, transform 0.08s;
            border: 1px solid #eef3fc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .saved-item:hover {
            background: #eaf1fd;
            border-color: #c6d8f0;
        }
        .saved-item:active {
            transform: scale(0.97);
            background: #dce8f8;
        }
        .saved-item .word-text {
            font-size: 17px;
            font-weight: 500;
            color: #0b1b32;
            letter-spacing: -0.2px;
        }
        .saved-item .word-phonetic {
            font-size: 13px;
            color: #6d7e94;
            background: #ecf0f5;
            padding: 0 8px;
            border-radius: 30px;
            line-height: 20px;
        }
        .saved-item .remove-hint {
            font-size: 12px;
            color: #9aabbe;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .saved-item:hover .remove-hint {
            opacity: 1;
        }

        .sidebar-empty {
            color: #9aabbe;
            font-size: 14px;
            text-align: center;
            padding: 24px 6px;
            line-height: 1.6;
        }
        .sidebar-empty .emoji {
            display: block;
            font-size: 32px;
            margin-bottom: 8px;
        }

        /* ===== 右侧主卡片 ===== */
        .app-container {
            flex: 1;
            min-width: 260px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.03);
            padding: 24px 18px 32px;
            transition: box-shadow 0.2s;
        }

        /* ===== 标题 ===== */
        .app-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #0b1b32;
        }
        .app-header .hint {
            font-size: 14px;
            color: #7e8b9e;
            font-weight: 400;
            background: #f0f3f8;
            padding: 4px 14px;
            border-radius: 30px;
        }

        /* ===== 搜索区域 ===== */
        .search-section {
            margin-bottom: 24px;
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f0f3f8;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            transition: background 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
            gap: 6px;
        }
        .search-wrapper:focus-within {
            background: white;
            border-color: #b0c7e7;
            box-shadow: 0 2px 10px rgba(48, 99, 184, 0.08);
        }
        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 4px 14px 0;
            font-size: 17px;
            outline: none;
            color: #0b1b32;
            min-width: 60px;
        }
        .search-wrapper input::placeholder {
            color: #9aabbe;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .search-wrapper .btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .search-wrapper button {
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .search-wrapper button:active {
            transform: scale(0.96);
        }

        .btn-search {
            background: #1e3a6f;
            box-shadow: 0 2px 6px rgba(27, 55, 112, 0.15);
        }
        .btn-search:hover {
            background: #1f3f78;
        }
        .btn-search:active {
            background: #14305a;
        }

        .btn-stash {
            background: #2b7a62;
            box-shadow: 0 2px 6px rgba(33, 110, 85, 0.18);
        }
        .btn-stash:hover {
            background: #2f8a70;
        }
        .btn-stash:active {
            background: #236a56;
        }
        .btn-stash:disabled {
            background: #b8c9d6;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ===== 结果区域 ===== */
        .result-area {
            margin-top: 8px;
        }

        .word-head {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-bottom: 10px;
        }
        .word-head .word {
            font-size: 32px;
            font-weight: 600;
            color: #0b1b32;
            letter-spacing: -0.5px;
        }
        .word-head .phonetic {
            font-size: 18px;
            color: #4a5a72;
            font-weight: 400;
            background: #ecf0f5;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.2px;
        }
        .word-head .origin {
            width: 100%;
            font-size: 14px;
            color: #6d7e94;
            margin-top: 2px;
            line-height: 1.5;
            background: #f8faff;
            padding: 8px 14px;
            border-radius: 16px;
            border-left: 3px solid #b7cee8;
        }

        .meaning-block {
            margin-top: 18px;
            border-top: 1px solid #e9edf4;
            padding-top: 18px;
        }
        .part-of-speech {
            font-size: 20px;
            font-weight: 600;
            color: #1e3a6f;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .part-of-speech span {
            background: #dce5f2;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #1a3361;
            line-height: 26px;
        }

        .definition-item {
            background: #fafcff;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #eef3fc;
            transition: background 0.1s;
        }
        .definition-item .def-text {
            font-size: 17px;
            line-height: 1.5;
            color: #132239;
            margin-bottom: 8px;
        }
        .definition-item .example {
            font-size: 15px;
            color: #3b5779;
            background: #f0f5fe;
            padding: 8px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 4px;
            font-style: italic;
            border-left: 3px solid #8dabcf;
            margin-right: 6px;
        }
        .definition-item .example::before {
            content: "“";
            opacity: 0.5;
        }
        .definition-item .example::after {
            content: "”";
            opacity: 0.5;
        }

        .placeholder-message {
            text-align: center;
            padding: 40px 10px 20px;
            color: #8d9cb0;
            font-size: 16px;
            letter-spacing: 0.2px;
        }
        .placeholder-message .emoji-big {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .not-found {
            background: #fff6f0;
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            color: #a05a3a;
            border: 1px solid #ffe2d0;
        }
        .not-found strong {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #1e3a6f;
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #dce5f2;
            border-top-color: #1e3a6f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-area .meaning-block:first-of-type {
            animation: fadeSlide 0.2s ease;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0.5;
                transform: translateY(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .audio-badge {
            display: inline-block;
            margin-left: 6px;
            font-size: 13px;
            color: #2b5d9e;
            background: #e4ecf9;
            padding: 0 10px;
            border-radius: 30px;
            line-height: 24px;
        }

        /* ===== Toast 消息 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0b1b32;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: opacity 0.25s, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            letter-spacing: 0.2px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .app-layout {
                flex-direction: column;
                gap: 14px;
            }
            .sidebar {
                flex: 1 1 auto;
                width: 100%;
                max-height: 140px;
                min-height: auto;
                padding: 14px 14px 12px;
                border-radius: 20px;
                order: -1;
            }
            .sidebar-title {
                font-size: 14px;
                padding-bottom: 8px;
            }
            .sidebar-title .badge {
                font-size: 11px;
                line-height: 20px;
            }
            .sidebar-list {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
                overflow-y: hidden;
                padding-top: 8px;
                gap: 8px;
                padding-bottom: 4px;
            }
            .sidebar-list::-webkit-scrollbar {
                height: 3px;
            }
            .sidebar-list::-webkit-scrollbar-thumb {
                background: #d0dbe8;
                border-radius: 10px;
            }
            .saved-item {
                flex: 0 0 auto;
                padding: 8px 16px;
                border-radius: 40px;
                white-space: nowrap;
                gap: 6px;
                background: #f0f5fe;
                border-color: #dce8f8;
            }
            .saved-item .word-text {
                font-size: 15px;
            }
            .saved-item .word-phonetic {
                font-size: 12px;
                padding: 0 6px;
                line-height: 18px;
            }
            .saved-item .remove-hint {
                display: none;
            }
            .sidebar-empty {
                padding: 8px 6px;
                font-size: 13px;
                white-space: nowrap;
            }
            .sidebar-empty .emoji {
                display: inline;
                font-size: 18px;
                margin-bottom: 0;
                margin-right: 6px;
            }
            .app-container {
                padding: 18px 14px 24px;
                border-radius: 24px;
            }
            .app-header h1 {
                font-size: 22px;
            }
            .search-wrapper input {
                font-size: 16px;
                padding: 12px 4px 12px 0;
            }
            .search-wrapper button {
                font-size: 14px;
                padding: 8px 14px;
            }
            .word-head .word {
                font-size: 28px;
            }
            .word-head .phonetic {
                font-size: 16px;
            }
            .part-of-speech {
                font-size: 18px;
            }
            .definition-item .def-text {
                font-size: 16px;
            }
            .definition-item .example {
                font-size: 14px;
                padding: 6px 12px;
            }
            .btn-stash {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px 6px 30px;
            }
            .app-container {
                padding: 14px 10px 20px;
                border-radius: 20px;
            }
            .sidebar {
                padding: 10px 10px 8px;
                border-radius: 16px;
                max-height: 110px;
            }
            .search-wrapper {
                padding: 3px 3px 3px 14px;
                border-radius: 40px;
            }
            .search-wrapper input {
                font-size: 15px;
                padding: 10px 2px 10px 0;
            }
            .search-wrapper button {
                font-size: 13px;
                padding: 6px 12px;
            }
            .btn-stash {
                font-size: 12px;
                padding: 6px 10px;
            }
            .word-head .word {
                font-size: 24px;
            }
            .word-head .phonetic {
                font-size: 14px;
                padding: 0 10px;
            }
            .definition-item .def-text {
                font-size: 15px;
            }
            .definition-item .example {
                font-size: 13px;
                padding: 4px 10px;
            }
            .saved-item {
                padding: 6px 12px;
                font-size: 13px;
            }
            .saved-item .word-text {
                font-size: 14px;
            }
            .saved-item .word-phonetic {
                font-size: 11px;
                line-height: 16px;
                padding: 0 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Toast 消息 ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 整体布局 ===== -->
    <div class="app-layout">

        <!-- ===== 左侧边栏：暂存列表 ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">
                📌 暂存路径
                <span class="badge" id="stashCount">0</span>
            </div>
            <div class="sidebar-list" id="sidebarList">
                <div class="sidebar-empty">
                    <span class="emoji">📭</span>
                    暂无暂存词<br>
                    <span style="font-size:13px;color:#b0c0d2;">查词后点击「暂存」</span>
                </div>
            </div>
        </aside>

        <!-- ===== 右侧主内容 ===== -->
        <div class="app-container" role="main">

            <header class="app-header">
                <h1>📖 词典</h1>
                <span class="hint">简约 · 暂存</span>
            </header>

            <div class="search-section">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="输入单词, 如 hello" autofocus>
                    <div class="btn-group">
                        <button class="btn-search" id="searchBtn">查词</button>
                        <button class="btn-stash" id="stashBtn" disabled>暂存</button>
                    </div>
                </div>
            </div>

            <div class="result-area" id="resultArea">
                <div class="placeholder-message" id="placeholder">
                    <span class="emoji-big">🔍</span>
                    输入单词，点击查词
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const stashBtn = document.getElementById('stashBtn');
            const resultArea = document.getElementById('resultArea');
            const sidebarList = document.getElementById('sidebarList');
            const stashCount = document.getElementById('stashCount');

            // ===== 状态 =====
            let currentResult = null; // { word, data } 当前查询成功的数据
            let savedItems = []; // [{ id, word, data }]

            // ===== Toast =====
            let toastTimer = null;

            function showToast(msg, duration) {
                duration = duration || 2200;
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    el.classList.remove('show');
                }, duration);
            }

            // ===== API =====
            async function fetchDictionaryData(word) {
                const trimmed = word.trim();
                if (!trimmed) return null;
                const url =
                    `https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(trimmed)}`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        if (response.status === 404) {
                            return { error: 'not_found', word: trimmed };
                        }
                        return { error: 'http_error', status: response.status };
                    }
                    const data = await response.json();
                    if (data && data.entries && data.entries.length > 0) {
                        return data;
                    }
                    return { error: 'not_found', word: trimmed };
                } catch (err) {
                    return { error: 'network', message: err.message };
                }
            }

            // ===== 渲染结果 =====
            function renderEntry(apiResponse, queryWord) {
                if (!apiResponse || apiResponse.error) {
                    if (apiResponse?.error === 'not_found') {
                        resultArea.innerHTML = `
                            <div class="not-found">
                                <strong>😕 未找到 “${apiResponse.word || queryWord}”</strong>
                                <span style="font-size:15px;">请检查拼写，或尝试其他单词</span>
                            </div>
                        `;
                    } else if (apiResponse?.error === 'network') {
                        resultArea.innerHTML = `
                            <div class="not-found">
                                <strong>🌐 网络请求失败</strong>
                                <span style="font-size:15px;">请检查网络连接后重试</span>
                            </div>
                        `;
                    } else {
                        resultArea.innerHTML = `
                            <div class="not-found">
                                <strong>⚠️ 查询出错</strong>
                                <span style="font-size:15px;">${apiResponse?.message || '请稍后再试'}</span>
                            </div>
                        `;
                    }
                    // 查询失败，禁用暂存
                    currentResult = null;
                    stashBtn.disabled = true;
                    return;
                }

                // 有效数据
                const word = apiResponse.word || queryWord;
                const entries = apiResponse.entries || [];

                // 音标
                let phoneticDisplay = '';
                for (const entry of entries) {
                    if (entry.pronunciations && entry.pronunciations.length > 0) {
                        const found = entry.pronunciations.find(p => p.text);
                        if (found) {
                            phoneticDisplay = found.text;
                            break;
                        }
                    }
                }

                let html = '';

                // 单词头部
                html += `<div class="word-head">`;
                html += `<span class="word">${word}</span>`;
                if (phoneticDisplay) {
                    html += `<span class="phonetic">${phoneticDisplay}</span>`;
                }
                html += `</div>`;

                // 释义
                entries.forEach(entry => {
                    const partOfSpeech = entry.partOfSpeech || '词性';
                    const senses = entry.senses || [];

                    html += `<div class="meaning-block">`;
                    html += `<div class="part-of-speech"><span>${partOfSpeech}</span></div>`;

                    senses.forEach(sense => {
                        const definition = sense.definition || '';
                        const examples = sense.examples || [];

                        html += `<div class="definition-item">`;
                        html += `<div class="def-text">${definition}</div>`;
                        if (examples.length > 0) {
                            examples.forEach(ex => {
                                if (ex) {
                                    html += `<div class="example">${ex}</div>`;
                                }
                            });
                        }
                        html += `</div>`;
                    });

                    html += `</div>`;
                });

                if (entries.length === 0) {
                    html += `<div class="meaning-block"><p style="color:#6d7e94;">(无释义)</p></div>`;
                }

                resultArea.innerHTML = html;

                // 保存当前结果，启用暂存按钮
                currentResult = { word, data: apiResponse };
                stashBtn.disabled = false;
            }

            // ===== 加载状态 =====
            function showLoading() {
                resultArea.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>查询中…</div>
                    </div>
                `;
                // 加载中禁用暂存
                stashBtn.disabled = true;
            }

            // ===== 侧边栏渲染 =====
            function renderSidebar() {
                if (savedItems.length === 0) {
                    sidebarList.innerHTML = `
                        <div class="sidebar-empty">
                            <span class="emoji">📭</span>
                            暂无暂存词<br>
                            <span style="font-size:13px;color:#b0c0d2;">查词后点击「暂存」</span>
                        </div>
                    `;
                    stashCount.textContent = '0';
                    return;
                }

                let html = '';
                savedItems.forEach((item, index) => {
                    // 从 data 中提取音标用于显示
                    let ph = '';
                    if (item.data && item.data.entries) {
                        for (const entry of item.data.entries) {
                            if (entry.pronunciations && entry.pronunciations.length > 0) {
                                const found = entry.pronunciations.find(p => p.text);
                                if (found) {
                                    ph = found.text;
                                    break;
                                }
                            }
                        }
                    }
                    html += `
                        <div class="saved-item" data-index="${index}">
                            <span class="word-text">${item.word}</span>
                            ${ph ? `<span class="word-phonetic">${ph}</span>` : ''}
                            <span class="remove-hint">↩</span>
                        </div>
                    `;
                });
                sidebarList.innerHTML = html;
                stashCount.textContent = savedItems.length;

                // 绑定点击事件
                document.querySelectorAll('.saved-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        const idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx >= 0 && idx < savedItems.length) {
                            restoreItem(idx);
                        }
                    });
                });
            }

            // ===== 暂存当前结果 =====
            function stashCurrent() {
                if (!currentResult) {
                    showToast('请先查询一个有效的单词', 1800);
                    return;
                }

                // 检查是否已经暂存过同一个词（避免重复保存相同词）
                // 但用户可以多次暂存同一词，不做限制，完全按用户意愿
                // 不过可以提示一下
                const already = savedItems.some(item => item.word === currentResult.word);
                if (already) {
                    // 仍然保存，但给一个轻微提示
                }

                // 保存
                savedItems.push({
                    id: Date.now() + Math.random() * 1000,
                    word: currentResult.word,
                    data: currentResult.data
                });

                // 清空搜索框
                searchInput.value = '';

                // 结果区域保持不变（继续显示当前结果）
                // 更新侧边栏
                renderSidebar();

                // 暂存按钮保持可用（因为 currentResult 还在）
                stashBtn.disabled = false;

                showToast(`✅ “${currentResult.word}” 已暂存`, 1800);

                // 聚焦搜索框
                searchInput.focus();
            }

            // ===== 恢复暂存项（点击侧边栏） =====
            function restoreItem(index) {
                const item = savedItems[index];
                if (!item) return;

                // 从列表中移除
                savedItems.splice(index, 1);
                renderSidebar();

                // 恢复结果
                renderEntry(item.data, item.word);

                // 填入搜索框
                searchInput.value = item.word;

                // 聚焦
                searchInput.focus();

                showToast(`↩ 已恢复 “${item.word}” 并移出暂存`, 1600);
            }

            // ===== 主查询 =====
            async function handleSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    resultArea.innerHTML = `
                        <div class="placeholder-message">
                            <span class="emoji-big">📝</span>
                            请输入单词
                        </div>
                    `;
                    currentResult = null;
                    stashBtn.disabled = true;
                    return;
                }

                showLoading();

                const result = await fetchDictionaryData(query);
                renderEntry(result, query);

                // 如果查询成功，结果已保存到 currentResult，暂存按钮已启用
                // 如果失败，renderEntry 会禁用暂存按钮
            }

            // ===== 事件绑定 =====
            searchBtn.addEventListener('click', handleSearch);

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            // 暂存按钮
            stashBtn.addEventListener('click', stashCurrent);

            // 初始化：自动查询 hello
            window.addEventListener('DOMContentLoaded', () => {
                handleSearch();
            });

            // 聚焦选中
            searchInput.addEventListener('focus', function() {
                this.select();
            });

            // 额外：当输入框内容变化时，如果有暂存结果且输入为空，可考虑重置状态，但保留 currentResult
            // 用户手动清空输入框不会影响 currentResult

            // 暴露一些变量便于调试（非必须）
            window.__debug = { savedItems, currentResult, stashCurrent, restoreItem };

        })();
    </script>

</body>
</html>
